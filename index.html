<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>개역개정 타이핑 암송 노트</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4a6fa5">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        :root {
            --primary: #4a6fa5;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #333333;
            --success: #28a745;
        }
        * { -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            padding-bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        h2 {
            text-align: center;
            color: var(--primary);
            margin-top: 0;
            margin-bottom: 15px;
        }
        h3 {
            color: #555;
            margin-top: 5px;
            margin-bottom: 10px;
            font-size: 16px;
            border-left: 4px solid var(--primary);
            padding-left: 8px;
        }
        textarea {
            width: 100%;
            height: 70px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            resize: none;
            box-sizing: border-box;
        }
        .viewer {
            min-height: 100px;
            background: #f9f9f9;
            border: 2px dashed #4a6fa5;
            border-radius: 10px;
            padding: 15px;
            font-size: 18px;
            line-height: 2.2;
            text-align: center;
            margin-top: 15px;
            margin-bottom: 15px;
            word-break: keep-all;
        }
        .blank-input {
            width: 80px;
            font-size: 16px;
            padding: 2px 5px;
            margin: 0 3px;
            border: 2px solid #aaa;
            border-radius: 4px;
            text-align: center;
            background-color: #fff9e6;
            transition: all 0.2s;
        }
        .blank-input:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #fff;
        }
        .blank-input.correct {
            border: 2px solid var(--success);
            background-color: #e8f5e9;
            color: var(--success);
            font-weight: bold;
        }
        .blank-input.wrong {
            border: 2px solid #dc3545;
            background-color: #ffeade;
        }
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }
        button {
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-primary { background-color: var(--primary); color: white; }
        .btn-secondary { background-color: #6c757d; color: white; }
        .btn-success { background-color: var(--success); color: white; }
        .btn-warning { background-color: #e0a800; color: white; }
        .btn-danger { background-color: #dc3545; color: white; }
        .btn-full { grid-column: span 2; }

        .status {
            text-align: center;
            font-weight: bold;
            color: #666;
            font-size: 13px;
            margin-bottom: 15px;
        }
        .verse-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 250px;
            overflow-y: auto;
        }
        .verse-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
            gap: 10px;
        }
        .verse-item:last-child { border-bottom: none; }
        .verse-checkbox { width: 18px; height: 18px; cursor: pointer; }
        .verse-text-clickable {
            flex-grow: 1;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .verse-item.completed .verse-text-clickable {
            text-decoration: line-through;
            color: #aaa;
        }
        .delete-btn { background: none; border: none; color: #ff4d4d; cursor: pointer; font-size: 16px; padding: 0 5px; }

        #installBtn {
            display: none;
            max-width: 500px;
            width: 100%;
            margin-bottom: 15px;
            background-color: #333;
            color: #fff;
        }
    </style>
</head>
<body>

<button id="installBtn">📲 홈 화면에 앱으로 설치하기</button>

<div class="container">
    <h2>📖 개역개정 타이핑 암송</h2>

    <h3>✏️ 구절 추가 / 현재 구절</h3>
    <textarea id="bibleInput" placeholder="암송할 개역개정 성경 구절을 입력하세요.">시몬 베드로가 대답하여 이르되 주는 그리스도시요 살아 계신 하나님의 아들이시니이다 (마태복음 16:16)</textarea>

    <div class="controls" style="margin-top: 8px;">
        <button class="btn-success btn-full" onclick="saveCurrentVerse()">💾 현재 구절 목록에 저장</button>
    </div>

    <!-- 암송 화면 -->
    <div id="bibleViewer" class="viewer">본문이 여기에 표시됩니다.</div>
    <div id="statusText" class="status">가려진 분량: 0%</div>

    <!-- 조작 버튼 -->
    <div class="controls">
        <button class="btn-secondary" onclick="loadInputVerse()">🔄 현재 입력창 글로 리셋</button>
        <button class="btn-primary" onclick="hideRandom()">👁️ 랜덤 단어 숨기기</button>
        <button class="btn-danger btn-full" onclick="hideAll()">🚫 전체 숨기기</button>
        <button class="btn-warning btn-full" id="hintToggleBtn" onclick="toggleHints()">💡 전체 정답 힌트 보기</button>
    </div>
</div>

<!-- 저장된 목록 창 -->
<div class="container">
    <h3>🗂️ 나의 암송 노트 & 체크리스트</h3>
    <ul id="verseList" class="verse-list"></ul>
</div>

<script>
    let originalWords = [];
    let hiddenIndices = new Set();
    let savedVerses = [];
    let hintsVisible = false;

    const STORAGE_KEY = 'savedBibleVerses';

    function loadSavedVerses() {
        const data = localStorage.getItem(STORAGE_KEY);
        if (data) {
            savedVerses = JSON.parse(data);
        } else {
            savedVerses = [
                { text: "시몬 베드로가 대답하여 이르되 주는 그리스도시요 살아 계신 하나님의 아들이시니이다 (마태복음 16:16)", completed: false },
                { text: "여호와의 인자와 긍휼이 무궁하시므로 우리가 진멸되지 아니함이니이다 이것들이 아침마다 새로우니 주의 성실하심이 크시도소이다 (예레미야애가 3:22-23)", completed: false },
                { text: "주의 말씀은 내 발에 등이요 내 길에 빛이니이다 (시편 119:105)", completed: false },
                { text: "모든 성경은 하나님의 감동으로 된 것으로 교훈과 책망과 바르게 함과 의로 교육하기에 유익하니 (디모데후서 3:16)", completed: false },
                { text: "너는 기도할 때에 네 골방에 들어가 문을 닫고 은밀한 중에 계신 네 아버지께 기도하라 은밀한 중에 보시는 네 아버지께서 갚으시리라 (마태복음 6:6)", completed: false },
                { text: "너희가 악한 자라도 좋은 것으로 자식에게 줄 줄 알거든 하물며 하늘에 계신 너희 아버지께서 구하는 자에게 좋은 것으로 주시지 않겠느냐 (마태복음 7:11)", completed: false },
                { text: "이 율법책을 네 입에서 떠나지 말게 하며 주야로 그것을 묵상하여 그 안에 기록된 대로 다 지켜 행하라 그리하면 네 길이 평탄하게 될 것이며 네가 형통하리라 (여호수아 1:8)", completed: false },
                { text: "내가 영원한 사랑으로 너를 사랑하기에 인자함으로 너를 이끌었다 하였노라 (예레미야 31:3하)", completed: false },
                { text: "예수께서 이르시되 내가 곧 길이요 진리요 생명이니 나로 말미암지 않고는 아버지께로 올 자가 없느니라 (요한복음 14:6)", completed: false },
                { text: "주 예수 그리스도의 은혜와 하나님의 사랑과 성령의 교통하심이 너희 무리와 함께 있을지어다 (고린도후서 13:13)", completed: false },
                { text: "한번 죽는 것은 사람에게 정해진 것이요 그 후에는 심판이 있으리니 (히브리서 9:27)", completed: false },
                { text: "그리스도께서 우리를 위하여 저주를 받은 바 되사 율법의 저주에서 우리를 속량하셨으니 기록된 바 나무에 달린 자마다 저주 아래에 있는 자라 하였음이라 (갈라디아서 3:13)", completed: false },
                { text: "내가 그리스도와 함께 십자가에 못 박혔나니 그런즉 이제는 내가 사는 것이 아니요 오직 내 안에 그리스도께서 사시는 것이라 이제 내가 육체 가운데 사는 것은 나를 사랑하사 나를 위하여 자기 자신을 버리신 하나님의 아들을 믿는 믿음 안에서 사는 것이라 (갈라디아서 2:20)", completed: false },
                { text: "우리가 유대인이나 헬라인이나 종이나 자유인이나 다 한 성령으로 세례를 받아 한 몸이 되었고 또 다 한 성령을 마시게 하셨느니라 (고린도전서 12:13)", completed: false },
                { text: "너희의 믿음의 역사와 사랑의 수고와 우리 주 예수 그리스도에 대한 소망의 인내를 우리 하나님 아버지 앞에서 끊임없이 기억함이니 하나님의 사랑하심을 받은 형제들아 너희를 택하심을 아노라 (데살로니가전서 1:3-4)", completed: false },
                { text: "아브라함이 바랄 수 없는 중에 바라고 믿었으니 이는 네 후손이 이같으리라 하신 말씀대로 많은 민족의 조상이 되게 하려 하심이라 (로마서 4:18)", completed: false },
                { text: "자기 아들을 아끼지 아니하시고 우리 모든 사람을 위하여 내주신 이가 어찌 그 아들과 함께 모든 것을 우리에게 주시지 아니하겠느냐 (로마서 8:32)", completed: false },
                { text: "오직 성령의 열매는 사랑과 희락과 화평과 오래 참음과 자비와 양선과 충성과 온유와 절제니 이같은 것을 금지할 법이 없느니라 (갈라디아서 5:22-23)", completed: false },
                { text: "주를 향하여 이 소망을 가진 자마다 그의 깨끗하심과 같이 자기를 깨끗하게 하느니라 (요한1서 3:3)", completed: false },
                { text: "주께서 호령과 천사장의 소리와 하나님의 나팔 소리로 친히 하늘로부터 강림하시리니 그리스도 안에서 죽은 자들이 먼저 일어나고 그 후에 우리 살아 남은 자들도 그들과 함께 구름 속으로 끌어 올려 공중에서 주를 영접하게 하시리니 그리하여 우리가 항상 주와 함께 있으리라 (데살로니가전서 4:16-17)", completed: false },
                { text: "나의 계명을 지키는 자라야 나를 사랑하는 자니 나를 사랑하는 자는 내 아버지께 사랑을 받을 것이요 나도 그를 사랑하여 그에게 나를 나타내리라 (요한복음 14:21)", completed: false },
                { text: "만일 누가 말하려면 하나님의 말씀을 하는 것 같이 하고 누가 봉사하려면 하나님이 공급하시는 힘으로 하는 것 같이 하라 (베드로전서 4:11상)", completed: false },
                { text: "이같이 너희 빛이 사람 앞에 비치게 하여 그들로 너희 착한 행실을 보고 하늘에 계신 너희 아버지께 영광을 돌리게 하라 (마태복음 5:16)", completed: false },
                { text: "사람은 그 입의 대답으로 말미암아 기쁨을 얻나니 때에 맞는 말이 얼마나 아름다운고 (잠언 15:23)", completed: false },
                { text: "내가 이미 얻었다 함도 아니요 온전히 이루었다 함도 아니라 오직 내가 그리스도 예수께 잡힌 바 된 그것을 잡으려고 달려가노라 (빌립보서 3:12)", completed: false },
                { text: "또한 너는 청년의 정욕을 피하고 주를 깨끗한 마음으로 부르는 자들과 함께 의와 믿음과 사랑과 화평을 따르라 (디모데후서 2:22)", completed: false },
                { text: "오늘 내가 네게 명하는 이 말씀을 너는 마음에 새기고 네 자녀에게 부지런히 가르치며 집에 앉았을 때에든지 길을 갈 때에든지 누워 있을 때에든지 일어날 때에든지 이 말씀을 강론할 것이며 (신명기 6:6-7)", completed: false },
                { text: "우리가 알거니와 하나님을 사랑하는 자 곧 그의 뜻대로 부르심을 입은 자들에게는 모든 것이 합력하여 선을 이루느니라 (로마서 8:28)", completed: false },
                { text: "볼지어다 내가 문 밖에 서서 두드리노니 누구든지 내 음성을 듣고 문을 열면 내가 그에게로 들어가 그와 더불어 먹고 그는 나와 더불어 먹으리라 (요한계시록 3:20)", completed: false },
                { text: "네가 이 세대에서 부한 자들을 명하여 마음을 높이지 말고 정함이 없는 재물에 소망을 두지 말고 오직 우리에게 모든 것을 후히 주사 누리게 하시는 하나님께 두며 (디모데전서 6:17)", completed: false },
                { text: "끝으로 너희가 주 안에서와 그 힘의 능력으로 강건하여지고 마귀의 간계를 능히 대적하기 위하여 하나님의 전신 갑주를 입으라 (에베소서 6:10-11)", completed: false },
                { text: "자녀들아 우리가 말과 혀로만 사랑하지 말고 행함과 진실함으로 하자 (요한1서 3:18)", completed: false },
            ];
            saveToStorage();
        }
        renderList();
    }

    function saveToStorage() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(savedVerses));
    }

    function loadInputVerse() {
        const text = document.getElementById('bibleInput').value.trim();
        if (!text) return;
        originalWords = text.split(/\s+/);
        hiddenIndices.clear();
        resetHintState();
        renderViewer();
    }

    function resetHintState() {
        hintsVisible = false;
        const btn = document.getElementById('hintToggleBtn');
        if (btn) btn.innerText = '💡 전체 정답 힌트 보기';
    }

    // 암송 화면 렌더링 (텍스트와 입력 필드 조합)
    function renderViewer() {
        const viewer = document.getElementById('bibleViewer');
        viewer.innerHTML = '';

        originalWords.forEach((word, index) => {
            if (hiddenIndices.has(index)) {
                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'blank-input';
                input.dataset.index = index;
                const cleanWord = word.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "");
                input.style.width = `${Math.max(40, cleanWord.length * 18)}px`;
                input.placeholder = `(${cleanWord.length}글자)`;

                input.oninput = function() {
                    checkAnswer(this, word);
                };

                viewer.appendChild(input);
            } else {
                const span = document.createElement('span');
                span.innerText = word;
                viewer.appendChild(span);
            }
            viewer.appendChild(document.createTextNode(' '));
        });

        updateStatus();
    }

    function checkAnswer(inputElement, correctWord) {
        const userAnswer = inputElement.value.trim();

        const cleanUser = userAnswer.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "");
        const cleanCorrect = correctWord.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "");

        if (cleanUser === cleanCorrect) {
            inputElement.className = 'blank-input correct';
            inputElement.value = correctWord;
            inputElement.disabled = true;
            focusNextInput(inputElement);
        } else {
            if (userAnswer.length >= cleanCorrect.length) {
                inputElement.classList.add('wrong');
            } else {
                inputElement.classList.remove('wrong');
            }
        }
    }

    function focusNextInput(currentInput) {
        const allInputs = Array.from(document.querySelectorAll('.blank-input'));
        const currentIndex = allInputs.indexOf(currentInput);
        if (currentIndex !== -1 && currentIndex + 1 < allInputs.length) {
            allInputs[currentIndex + 1].focus();
        } else {
            checkAllCompleted();
        }
    }

    function checkAllCompleted() {
        const allInputs = document.querySelectorAll('.blank-input');
        const allCorrect = Array.from(allInputs).every(input => input.disabled === true);
        if (allCorrect && allInputs.length > 0) {
            alert('🎉 대단합니다! 해당 구절을 완벽하게 타이핑 암송하셨습니다!');
        }
    }

    function updateStatus() {
        const percent = originalWords.length ? Math.round((hiddenIndices.size / originalWords.length) * 100) : 0;
        document.getElementById('statusText').innerText = `가려진 빈칸: ${hiddenIndices.size}개 (전체 단어의 ${percent}%)`;
    }

    function saveCurrentVerse() {
        const text = document.getElementById('bibleInput').value.trim();
        if (!text) return;
        if (savedVerses.some(v => v.text === text)) {
            alert('이미 목록에 있는 구절입니다.');
            return;
        }
        savedVerses.push({ text: text, completed: false });
        saveToStorage();
        renderList();
    }

    function renderList() {
        const listEl = document.getElementById('verseList');
        listEl.innerHTML = '';
        if (savedVerses.length === 0) {
            listEl.innerHTML = '저장된 구절이 없습니다.';
            return;
        }
        savedVerses.forEach((verse, index) => {
            const li = document.createElement('li');
            li.className = `verse-item ${verse.completed ? 'completed' : ''}`;

            const chk = document.createElement('input');
            chk.type = 'checkbox';
            chk.className = 'verse-checkbox';
            chk.checked = verse.completed;
            chk.onchange = function() {
                savedVerses[index].completed = chk.checked;
                saveToStorage();
                renderList();
            };

            const textSpan = document.createElement('span');
            textSpan.className = 'verse-text-clickable';
            textSpan.innerText = verse.text;
            textSpan.onclick = function() {
                document.getElementById('bibleInput').value = verse.text;
                loadInputVerse();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const delBtn = document.createElement('button');
            delBtn.className = 'delete-btn';
            delBtn.innerHTML = '❌';
            delBtn.onclick = function() {
                if (confirm('이 구절을 삭제하시겠습니까?')) {
                    savedVerses.splice(index, 1);
                    saveToStorage();
                    renderList();
                }
            };

            li.appendChild(chk);
            li.appendChild(textSpan);
            li.appendChild(delBtn);
            listEl.appendChild(li);
        });
    }

    function hideRandom() {
        if (originalWords.length === 0) loadInputVerse();
        if (hiddenIndices.size === originalWords.length) return;
        const amountToHide = Math.max(1, Math.ceil(originalWords.length * 0.15));
        let added = 0, attempts = 0;
        while (added < amountToHide && hiddenIndices.size < originalWords.length && attempts < 100) {
            const randomIndex = Math.floor(Math.random() * originalWords.length);
            if (!hiddenIndices.has(randomIndex)) {
                hiddenIndices.add(randomIndex);
                added++;
            }
            attempts++;
        }
        resetHintState();
        renderViewer();
        const firstInput = document.querySelector('.blank-input');
        if (firstInput) firstInput.focus();
    }

    function hideAll() {
        if (originalWords.length === 0) loadInputVerse();
        originalWords.forEach((_, index) => hiddenIndices.add(index));
        resetHintState();
        renderViewer();
        const firstInput = document.querySelector('.blank-input');
        if (firstInput) firstInput.focus();
    }

    // 힌트 보기 / 숨기기 토글
    function toggleHints() {
        if (hintsVisible) {
            hideAllHints();
        } else {
            showAllHints();
        }
    }

    function showAllHints() {
        const inputs = document.querySelectorAll('.blank-input');
        inputs.forEach(input => {
            if (!input.disabled) {
                const idx = input.dataset.index;
                input.value = originalWords[idx];
                input.style.color = '#d9534f';
            }
        });
        hintsVisible = true;
        const btn = document.getElementById('hintToggleBtn');
        if (btn) btn.innerText = '🙈 힌트 다시 숨기기';
    }

    function hideAllHints() {
        const inputs = document.querySelectorAll('.blank-input');
        inputs.forEach(input => {
            if (!input.disabled) {
                input.value = '';
                input.style.color = '';
                input.classList.remove('wrong');
            }
        });
        hintsVisible = false;
        const btn = document.getElementById('hintToggleBtn');
        if (btn) btn.innerText = '💡 전체 정답 힌트 보기';
        const firstInput = document.querySelector('.blank-input:not(:disabled)');
        if (firstInput) firstInput.focus();
    }

    window.onload = function() {
        loadSavedVerses();
        loadInputVerse();
    };

    // ---- PWA: 서비스 워커 등록 ----
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('service-worker.js').catch(() => {});
        });
    }

    // ---- PWA: 설치 버튼 ----
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.style.display = 'block';
    });
    installBtn.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        installBtn.style.display = 'none';
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
    });
    window.addEventListener('appinstalled', () => {
        installBtn.style.display = 'none';
    });
</script>

</body>
</html>
